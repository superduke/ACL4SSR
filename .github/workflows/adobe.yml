name: 更新 Clash/adobe.list

on:
  # 每 3 天运行一次
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载并验证 Adobe 规则
        run: python scripts/update_list.py adobe https://a.dove.isdumb.one/list.txt Clash/adobe.list

      - name: 更新 adobe.list
        run: bash scripts/commit-list-updates.sh "Downloaded file on $(date '+%Y/%m/%d %H:%M:%S')" Clash/adobe.list
