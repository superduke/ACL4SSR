name: 更新白嫖IP库
on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'  # 每天的8点、16点执行（UTC时间）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHECK_TIMEOUT_SECONDS: 20
      DOWNLOAD_TIMEOUT_SECONDS: 30
      DOWNLOAD_RETRY_COUNT: 3
      DOWNLOAD_RETRY_DELAY: 5
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: Check PROXYIP_URL variable
        run: |
          # 检查是否设置了PROXYIP_URL变量
          PROXYIP_URL="${{ vars.PROXYIP_URL }}"
          if [ -z "$PROXYIP_URL" ]; then
            echo "❌ 错误: 未设置 PROXYIP_URL 变量"
            echo "请在仓库设置中添加 PROXYIP_URL 变量："
            echo "1. 进入仓库 Settings > Secrets and variables > Actions"
            echo "2. 在 Variables 标签页中添加新变量"
            echo "3. Name: PROXYIP_URL"
            echo "4. Value: 配置文件的URL地址"
            exit 1
          fi
          echo "✅ PROXYIP_URL 变量已设置: $PROXYIP_URL"

      - name: Check URL status
        id: check_url
        run: |
          RAW_URL="${{ vars.PROXYIP_URL }}"
          # 如果URL不以http://或https://开头，则添加https://
          if [[ ! "$RAW_URL" =~ ^https?:// ]]; then
            NORMALIZED_URL="https://$RAW_URL"
          else
            NORMALIZED_URL="$RAW_URL"
          fi
          CURL_EXIT_CODE=0
          STATUS_CODE=$(curl -s -m "$CHECK_TIMEOUT_SECONDS" -o /dev/null -w "%{http_code}" "$NORMALIZED_URL") || CURL_EXIT_CODE=$?
          if [ "$CURL_EXIT_CODE" -ne 0 ]; then
            echo "url_status_ok=false" >> $GITHUB_OUTPUT
            if [ "$CURL_EXIT_CODE" -eq 28 ]; then
              echo "URL 检查失败 ($NORMALIZED_URL): curl 退出码 $CURL_EXIT_CODE (超时)" >&2
            else
              echo "URL 检查失败 ($NORMALIZED_URL): curl 退出码 $CURL_EXIT_CODE (网络错误)" >&2
            fi
            echo "已将 URL 状态标记为不可用，后续步骤将跳过。"
            exit 0
          fi
          echo "Status code: $STATUS_CODE"
          if [ "$STATUS_CODE" = "200" ]; then
            echo "url_status_ok=true" >> $GITHUB_OUTPUT
            echo "proxyip_url=$NORMALIZED_URL" >> $GITHUB_OUTPUT
            echo "URL 响应正常，状态码为 200"
          else
            echo "url_status_ok=false" >> $GITHUB_OUTPUT
            echo "URL 响应异常，状态码为 $STATUS_CODE，将跳过后续步骤"
          fi

      - name: Download
        if: steps.check_url.outputs.url_status_ok == 'true'
        run: |
          curl -L --max-time "$DOWNLOAD_TIMEOUT_SECONDS" --retry "$DOWNLOAD_RETRY_COUNT" --retry-delay "$DOWNLOAD_RETRY_DELAY" "${{ steps.check_url.outputs.proxyip_url }}" -o baipiao.txt

      - name: 提交更新的IP库文件
        if: steps.check_url.outputs.url_status_ok == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 检查文件是否有变化
          if [ ! -f baipiao.txt ] || [ ! -s baipiao.txt ]; then
            echo "baipiao.txt 文件不存在或为空，跳过提交"
            exit 0
          fi
          
          if git diff --quiet baipiao.txt 2>/dev/null; then
            echo "baipiao.txt 文件没有变化，跳过提交"
          else
            echo "检测到 baipiao.txt 文件有变化，开始提交"
            git add baipiao.txt
            git commit -m "更新IP库文件 $(date '+%Y-%m-%d %H:%M:%S')"
            git push
            echo "提交完成"
          fi
