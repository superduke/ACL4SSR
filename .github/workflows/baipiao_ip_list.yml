name: 更新白嫖IP库
on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'  # 每天 21:30 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROXYIP_URL: ${{ vars.PROXYIP_URL }}
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 检查 IP 列表源地址
        run: |
          if [ -z "$PROXYIP_URL" ]; then
            echo '请在仓库 Actions Variables 中配置 PROXYIP_URL，值必须是返回 IP 列表的完整 http(s) URL。'
            exit 1
          fi
          python -c 'import os; from scripts.update_list import validate_url; validate_url(os.environ["PROXYIP_URL"])'

      - name: 下载并验证 IP 列表
        run: python scripts/update_list.py baipiao "$PROXYIP_URL" baipiao.txt

      - name: 提交更新的 IP 库文件
        run: bash scripts/commit-list-updates.sh "更新IP库文件 $(date '+%Y-%m-%d %H:%M:%S')" baipiao.txt
